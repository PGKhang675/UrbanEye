services:
  - type: web
    name: urbaneye-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: models
      mountPath: /opt/render/project/src/app/models_data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
